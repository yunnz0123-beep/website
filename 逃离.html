<script>

/* =====================================================
   基础
===================================================== */

const CW = 360;
const CH = 720;

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const gameStage =
    document.getElementById("gameStage");


/* =====================================================
   存储
===================================================== */

let selectedCharacter =
    localStorage.getItem("officeCharacter")
    || "human";

let workEnd =
    localStorage.getItem("officeWorkEnd")
    || "18:00";

let testMode =
    localStorage.getItem("officeTestMode");

if(testMode === null){

    testMode = "true";

    localStorage.setItem(
        "officeTestMode",
        "true"
    );

}


let collected =
    JSON.parse(
        localStorage.getItem(
            "officeCollected"
        ) || "[]"
    );


/* =====================================================
   图鉴
===================================================== */

const collectibles = [

    {
        id:"plant",
        name:"工位植物",
        desc:"它比你更想下班。",
        type:"plant"
    },

    },

    {

        desc:"每个办公室都有一支。",
        type:"pen"
    },

        desc:"你没有告诉任何人。",
        type:"cookie"
    }

];


/* =====================================================
   屏幕
===================================================== */

function showScreen(id){

    document
        .querySelectorAll(".screen")
        .forEach(s=>{
            s.classList.remove("active");
        });

    document
        .getElementById(id)
        .classList.add("active");
}


/* =====================================================
   角色选择
===================================================== */

function selectCharacter(type){

    selectedCharacter = type;

    localStorage.setItem(
        "officeCharacter",
        type
    );

    updateCharacterCards();
}


function updateCharacterCards(){

    document
        .querySelectorAll(".character-card")
        .forEach(card=>{

            card.classList.toggle(
                "selected",
                card.dataset.character
                === selectedCharacter
            );

        });

}


/* =====================================================
   统一角色绘制
===================================================== */

function drawCharacter(
    ctx,
    x,
    y,
    type,
    scale=1
){

    ctx.save();

    ctx.translate(x,y);

    ctx.scale(scale,scale);

    /*
     * 阴影
     */

    ctx.fillStyle =
        "rgba(77,81,79,.12)";

    ctx.beginPath();

    ctx.ellipse(
        0,
        23,
        17,
        5,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =====================
       人
    ===================== */

    if(type === "human"){

        ctx.fillStyle =
            "#C8A58B";

        ctx.beginPath();

        ctx.arc(
            0,
            -12,
            14,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#626863";

        ctx.beginPath();

        ctx.arc(
            0,
            -15,
            14,
            Math.PI,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillRect(
            -14,
            -15,
            6,
            22
        );

        ctx.fillRect(
            8,
            -15,
            6,
            22
        );


        ctx.fillStyle =
            "#AAB5A4";

        ctx.beginPath();

        ctx.roundRect(
            -14,
            3,
            28,
            28,
            8
        );

        ctx.fill();


        ctx.strokeStyle =
            "#666C68";

        ctx.lineWidth = 5;

        ctx.beginPath();

        ctx.moveTo(
            -6,29
        );

        ctx.lineTo(
            -8,45
        );

        ctx.moveTo(
            6,29
        );

        ctx.lineTo(
            8,45
        );

        ctx.stroke();

    }


    /* =====================
       猴子
    ===================== */

    if(type === "monkey"){

        ctx.fillStyle =
            "#A99483";

        ctx.beginPath();

        ctx.arc(
            -14,
            -12,
            7,
            0,
            Math.PI*2
        );

        ctx.arc(
            14,
            -12,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            0,
            -10,
            17,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#D5C2AA";

        ctx.beginPath();

        ctx.ellipse(
            0,
            -4,
            10,
            8,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#4D514F";

        ctx.beginPath();

        ctx.arc(
            -6,
            -12,
            2,
            0,
            Math.PI*2
        );

        ctx.arc(
            6,
            -12,
            2,
            0,
            Math.PI*2
        );

        ctx.fill();


        ctx.fillStyle =
            "#B9A58F";

        ctx.beginPath();

        ctx.roundRect(
            -14,
            5,
            28,
            26,
            8
        );

        ctx.fill();

    }


    /* =====================
       青蛙
    ===================== */

    if(type === "frog"){

        ctx.fillStyle =

        );

        );

    /* =====================
       猫

    if(type === "cat"){

        ctx.fillStyle =

        ctx.beginPath();

        ctx.moveTo(
            -16,
            -16
        );

        ctx.lineTo(

            -31
        );

        ctx.lineTo(

        );

        ctx.fill();


        ctx.beginPath();

        ctx.moveTo(
            16,
            -16
        );

        ctx.lineTo(
            14,
            -31
        );

        ctx.lineTo(
            4,
            -20
        );

        ctx.arc(

/* =====================================================
   时间
===================================================== */

function updateHomeTime(){

    const now =
        new Date();

    const weekdays = [
        "Sunday",
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday",
        "Saturday"
    ];

    document
        .getElementById(
            "weekday"
        )
        .textContent =
        weekdays[now.getDay()];


    const hh =
        String(
            now.getHours()
        ).padStart(2,"0");

    const mm =
        String(
            now.getMinutes()
        ).padStart(2,"0");

    document
        .getElementById(
            "clock"
        )
        .textContent =
        hh + ":" + mm;


    if(testMode === "true"){

        document
            .getElementById(
                "countdown"
            )
            .textContent =
            "现在随时可以逃";

        return;

    }


    const parts =
        workEnd.split(":");

    const end =
        new Date();

    end.setHours(
        Number(parts[0]),
        Number(parts[1]),
        0,
        0
    );

    const diff =
        end.getTime()
        - now.getTime();


    if(diff <= 0){

        document
            .getElementById(
                "countdown"
            )
            .textContent =
            "已经下班了";

        return;

    }


    document
        .getElementById(
            "countdown"
        )
        .textContent =
        Math.ceil(
            diff / 60000
        ) + " 分钟";

}

/* =====================================================
   Canvas
===================================================== */

function resizeCanvas(){

    const rect =
        gameStage.getBoundingClientRect();

    const scale =
        Math.min(
            rect.width / CW,
            rect.height / CH
        );

    canvas.style.width =
        CW * scale + "px";

    canvas.style.height =
        CH * scale + "px";

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        CW * dpr;

    canvas.height =
        CH * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =====================================================
   输入
===================================================== */

function getCanvasPosition(e){

    const rect =
        canvas.getBoundingClientRect();

    return {

        x:
            (e.clientX - rect.left)
            / rect.width
            * CW,

        y:
            (e.clientY - rect.top)
            / rect.height
            * CH

    };

}


canvas.addEventListener(
    "pointerdown",
    e=>{

        if(!gameRunning){
            return;
        }

        pointerDown = true;

        const pos =
            getCanvasPosition(e);

        pointerTarget = pos;


        const item =
            findCollectible(
                pos.x,
                pos.y
            );

        if(item){

            collectGameItem(item);

        }


        canvas.setPointerCapture(
            e.pointerId
        );

    }
);


canvas.addEventListener(
    "pointermove",
    e=>{

        if(!pointerDown){
            return;
        }

        pointerTarget =
            getCanvasPosition(e);

    }
);


canvas.addEventListener(
    "pointerup",
    e=>{

        if(!gameRunning){
            return;
        }

        pointerDown = false;

        pointerTarget = null;

        /*
         * 松手时检查是否进入藏身点
         */

        tryHide();

    }
);


canvas.addEventListener(
    "pointercancel",
    ()=>{

        pointerDown = false;

        pointerTarget = null;

    }
);

/* =====================================================
   玩家移动
===================================================== */

function updatePlayer(delta){

    if(
        !pointerDown ||
        !pointerTarget ||
        hidden
    ){
        return;
    }


    let dx =
        pointerTarget.x
        - player.x;

    let dy =
        pointerTarget.y
        - player.y;

    const distance =
        Math.hypot(dx,dy);


    if(distance < 4){
        return;
    }


    dx /= distance;
    dy /= distance;


    const speed = 155;


    player.x +=
        dx * speed * delta;

    player.y +=
        dy * speed * delta;


    player.x =
        Math.max(
            22,
            Math.min(
                CW - 22,
                player.x
            )
        );


    player.y =
        Math.max(
            70,
            Math.min(
                CH - 28,
                player.y
            )
        );

}


/* =====================================================
   老板
===================================================== */

function updateBoss(delta){

    const target =
        bossPath[
            boss.pathIndex
        ];

    const dx =
        target.x - boss.x;

    const dy =
        target.y - boss.y;

    const distance =
        Math.hypot(dx,dy);


    if(distance < 4){

        boss.pathIndex =
            (
                boss.pathIndex + 1
            )
            % bossPath.length;

        return;

    }


    const speed = 65;


    boss.x +=
        dx / distance
        * speed
        * delta;

    boss.y +=
        dy / distance
        * speed
        * delta;

}


/* =====================================================
   收集物检测
===================================================== */

function findCollectible(
    x,
    y
){

    for(
        const item of gameItems
    ){

        if(
            collected.includes(
                item.id
            )
        ){
            continue;
        }


        const distance =
            Math.hypot(
                x - item.x,
                y - item.y
            );


        if(distance < 25){

            return item;

        }

    }


    return null;

}


/* =====================================================
   收集
===================================================== */

function collectGameItem(item){

    if(
        collected.includes(
            item.id
        )
    ){
        return;
    }


    collected.push(
        item.id
    );


    localStorage.setItem(
        "officeCollected",
        JSON.stringify(
            collected
        )
    );


    const data =
        collectibles.find(
            x=>x.id === item.id
        );


    if(data){

        showToast(
            "发现：" + data.name
        );

    }


    currentCollectible = null;

    updateCollectHint();

}

/* =====================================================
   躲藏检测
===================================================== */

function checkNearbyHide(){

    currentHideSpot = null;

    if(hidden){
        updateHideHint();
        return;
    }


    let closest = null;
    let closestDistance = Infinity;


    for(
        const spot of hides
    ){

        const distance =
            Math.hypot(
                player.x - spot.x,
                player.y - spot.y
            );


        if(
            distance < 58 &&
            distance < closestDistance
        ){

            closest = spot;
            closestDistance = distance;

        }

    }


    currentHideSpot = closest;

    updateHideHint();

}


function updateHideHint(){

    const hint =
        document.getElementById(
            "hideHint"
        );

    if(
        currentHideSpot &&
        !hidden
    ){

        hint.classList.add(
            "show"
        );

    }else{

        hint.classList.remove(
            "show"
        );

    }

}


/* =====================================================
   躲藏
===================================================== */

function tryHide(){

    if(hidden){
        return;
    }


    for(
        const spot of hides
    ){

        const distance =
            Math.hypot(
                player.x - spot.x,
                player.y - spot.y
            );


        if(distance < 42){

            hidden = true;

            hideUsed = true;

            currentHideSpot = spot;

            player.x = spot.x;
            player.y = spot.y;


            document
                .getElementById(
                    "gameStatus"
                )
                .textContent =
                "已藏好 · 别动";


            updateHideHint();


            /*
             * 第一次躲成功
             * 打开出口
             */

            if(!exitOpen){

                exitOpen = true;

                showToast(
                    "出口打开了"
                );

            }


            /*
             * 植物第一次触发
             */

            if(
                spot.type === "plant"
                &&
                !collected.includes("plant")
            ){

                collectGameItem({
                    id:"plant"
                });

            }


            /*
             * 藏好提示
             */

            if(!hideToastShown){

                showToast(
                    "已藏好 ✓"
                );

                hideToastShown = true;

            }


            /*
             * 1.6 秒后自动出来
             */

            setTimeout(
                ()=>{

                    if(gameRunning){

                        hidden = false;

                        currentHideSpot = null;

                        document
                            .getElementById(
                                "gameStatus"
                            )
                            .textContent =
                            exitOpen
                            ? "快跑，出口开了"
                            : "找地方躲起来";

                    }

                },
                1600
            );


            break;

        }

    }

}


/* =====================================================
   碰撞
===================================================== */

function checkBossCollision(){

    if(hidden){
        return false;
    }


    return (
        Math.hypot(
            player.x - boss.x,
            player.y - boss.y
        )
        < 25
    );

}


/* =====================================================
   结束
===================================================== */

function finishGame(
    success,
    reason
){

    gameRunning = false;

    pointerDown = false;

    pointerTarget = null;


    document
        .getElementById(
            "collectHint"
        )
        .classList.remove(
            "show"
        );

    document
        .getElementById(
            "hideHint"
        )
        .classList.remove(
            "show"
        );


    document
        .getElementById(
            "resultTitle"
        )
        .textContent =
        success
        ? "逃跑成功"
        : "逃跑失败";


    document
        .getElementById(
            "resultText"
        )
        .textContent =
        reason;


    document
        .getElementById(
            "resultModal"
        )
        .classList.add(
            "active"
        );


    let count =
        Number(
            localStorage.getItem(
                "officeEscapeCount"
            ) || 0
        );


    count++;


    localStorage.setItem(
        "officeEscapeCount",
        count
    );

}


/* =====================================================
   游戏循环
===================================================== */

let lastFrame = 0;

function gameLoop(timestamp){

    if(!gameRunning){
        return;
    }


    if(!lastFrame){
        lastFrame = timestamp;
    }


    const delta =
        Math.min(
            (timestamp - lastFrame)
            / 1000,
            .05
        );


    lastFrame = timestamp;


    updatePlayer(delta);

    updateBoss(delta);

    checkNearbyCollectible();

    checkNearbyHide();

    drawGame();


    /*
     * 被老板抓到
     */

    if(
        checkBossCollision()
    ){

        finishGame(
            false,
            "老板刚好转过头。"
        );

        lastFrame = 0;

        return;

    }


    /*
     * 逃到出口
     */

    if(
        exitOpen &&
        player.y > 665 &&
        player.x > 140 &&
        player.x < 220
    ){

        finishGame(
            true,
            "你从办公室门口逃了出去。"
        );

        lastFrame = 0;

        return;

    }


    /*
     * 一分钟结束
     */

    if(
        timestamp - gameStartTime
        >= gameDuration
    ){

        finishGame(
            false,
            "一分钟过去了，你还在办公室。"
        );

        lastFrame = 0;

        return;

    }


    requestAnimationFrame(
        gameLoop
    );

}


/* =====================================================

    ctx.clearRect(
        0,
        0,
        CW,
        CH
    );

    drawOffice();

    drawCollectiblesInOffice();

    drawExit();

    drawHideSpots();

    drawBoss();


    /*
     * 角色
     *
     * 躲好以后：
     * 半透明
     */

    ctx.save();

    if(hidden){

        ctx.globalAlpha = .48;

    }else{

        ctx.globalAlpha = 1;

    }

    drawCharacter(
        ctx,
        player.x,
        player.y,
        selectedCharacter,
        .78
    );

    ctx.restore();


    /*
     * 再画一次藏身物前景
     * 让角色真正被挡住
     */

    if(hidden && currentHideSpot){

        drawHideForeground(
            currentHideSpot
        );

    }

}

        );

}


/* =====================================================
   Toast
===================================================== */

let toastTimer;

function showToast(text){

    const toast =
        document.getElementById(
            "toast"
        );

    toast.textContent =
        text;

    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            ()=>{

                toast.classList.remove(
                    "show"
                );

            },
            1800
        );

}
